<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Explore the architecture behind AI Worker, an AI employee for Umrah and Haji travel agencies."><title>AI Worker · Technology architecture</title><style>/* AI Worker portfolio illustrations. Neutral, one accent, hairlines; content lives in illustrations.js. */
:root{
  --bg:#fafaf9;--paper:#fff;--ink:#1c1917;--muted:#57534e;--line:#e7e5e4;--line-strong:#d6d3d1;--wash:#f5f5f4;
  --accent:#1f7a5c;--accent-soft:#e6f2ed;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink);background:var(--bg);font-synthesis:none;-webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
body{margin:0}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
a{color:inherit}
p{margin:0}
.icon{width:20px;height:20px;display:block;flex-shrink:0}
.small-icon{width:15px;height:15px}
.logo{display:block;object-fit:contain;flex-shrink:0}

/* Page frame */
.shell{max-width:1320px;margin:auto;padding:28px 48px 40px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{text-decoration:none;font-weight:650;font-size:15px;letter-spacing:-.01em}
.page-nav{display:flex;gap:24px}
.page-nav a{position:relative;text-decoration:none;font-size:14px;color:var(--muted);padding:6px 0;transition:color .2s}
.page-nav a:after{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.page-nav a:hover,.page-nav a.current{color:var(--ink)}
.page-nav a:hover:after,.page-nav a.current:after{transform:scaleX(1)}
.intro{padding:72px 0 44px;max-width:780px}
h1{font-size:clamp(30px,4vw,54px);font-weight:620;letter-spacing:-.04em;line-height:1.05;margin:0 0 20px;text-wrap:balance}
h1 .w{display:inline-block}
.intro p{font-size:17px;line-height:1.6;color:var(--muted);max-width:620px}
.intro .meta{font-size:13.5px;margin-top:18px}

/* Explorer */
.workspace{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;border-bottom:1px solid var(--line);padding:10px 16px}
.filters{display:flex;gap:2px;flex-wrap:wrap}
.pill{border:0;background:transparent;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted);padding:8px 12px;white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.pill:hover{color:var(--ink)}
.pill[aria-pressed=true]{background:var(--wash);color:var(--ink)}
.pill:active{transform:scale(.97)}
.canvas-flag{font-size:13px;color:var(--muted);white-space:nowrap}
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:550;border:1px solid var(--line-strong);background:var(--paper);transition:background .15s,border-color .15s,transform .15s var(--ease)}
.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.primary:hover{background:#3a3532;transform:translateY(-1px)}
.secondary:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.primary:active,.secondary:active:not(:disabled){transform:scale(.97)}
.canvas-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px}
.canvas-wrap{display:flex;flex-direction:column;position:relative;background:var(--bg);min-width:0;overflow:hidden}
.canvas-header{padding:20px 24px 0}
.canvas-header strong{display:block;font-size:14px;font-weight:600}
.canvas-header p{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:3px;min-height:20px}
.stage-viewport{position:relative;overflow:auto;width:100%;min-height:400px;margin-block:auto}
.stage{position:relative;width:940px;height:600px;transform-origin:0 0}
.connections{position:absolute;inset:0;width:940px;height:600px;pointer-events:none}
.edge{stroke:var(--line-strong);stroke-width:1.5;fill:none;transition:stroke .3s,opacity .3s,stroke-width .3s}
.edge.active{stroke:var(--accent);stroke-width:2}
.edge.dim{opacity:.55}
.edge-label{font:11px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
/* A pulse travels each active edge: twice after a click, continuously while a trace or walkthrough plays. */
.pulse{fill:var(--accent);opacity:0;offset-distance:0%;offset-rotate:0deg}
.edge.active+.pulse{animation:pulse 2.2s linear 2}
.playing .edge.active+.pulse{animation-iteration-count:infinite}
@keyframes pulse{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}

/* Nodes */
.node{position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;text-align:left;padding:14px;gap:12px;transition:border-color .2s,transform .25s var(--ease),background .2s,box-shadow .25s;width:214px;min-height:82px}
.node:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.node:active{transform:scale(.985)}
.node.connected{border-color:var(--line-strong)}
.node.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node.dim{background:var(--wash);filter:grayscale(1)}
.node.dim strong,.node.dim small{color:var(--muted)}
.node>span:nth-child(2){min-width:0}
.badge{width:38px;height:38px;display:grid;place-items:center;flex-shrink:0;border-radius:9px;background:var(--wash);color:var(--ink)}
.badge.has-logo{background:var(--paper);border:1px solid var(--line)}
.badge .logo{width:22px;height:22px}
.node strong{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.node small{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.node .number{position:absolute;right:10px;top:8px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.group{position:absolute;border:1px dashed var(--line-strong);border-radius:14px;pointer-events:none}
.group-label{position:absolute;left:16px;top:12px;font-size:12px;font-weight:500;color:var(--muted)}
.note{position:absolute;font-size:12px;color:var(--muted)}
.flow .node.done{background:var(--bg)}
.flow .node.done .badge:not(.has-logo){background:var(--accent-soft);color:var(--accent)}

/* Entry motion: applied only by script, only when motion is allowed. */
.stage.pre .node,.stage.pre .edge,.stage.pre .edge-label,.stage.pre .group,.stage.pre .group-label,.stage.pre .note{opacity:0}
.stage.enter .node{animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--i)*70ms)}
.stage.enter .edge{stroke-dasharray:1;animation:draw .8s var(--ease) backwards;animation-delay:calc(.35s + var(--e)*80ms)}
.stage.enter .edge-label,.stage.enter .group,.stage.enter .group-label,.stage.enter .note{animation:fade .6s ease backwards;animation-delay:.9s}
.stage.enter .group{animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes draw{from{stroke-dashoffset:1;opacity:0}15%{opacity:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}

/* Under the canvas */
.canvas-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px 16px}
.zoom{display:flex;gap:4px;align-items:center;margin-left:auto}
.zoom button{display:grid;place-items:center;background:transparent;border:0;border-radius:7px;width:32px;height:32px;color:var(--muted);transition:background .15s,color .15s,transform .12s}
.zoom button:hover:not(:disabled){background:var(--wash);color:var(--ink)}
.zoom button:active:not(:disabled){transform:scale(.92)}
.zoom output{font-size:12px;color:var(--muted);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.journey-status{font-size:13px;color:var(--muted)}
.step-nav{display:flex;gap:4px;flex-wrap:wrap}
.step-nav button{width:30px;height:30px;border-radius:50%;background:transparent;border:1px solid transparent;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;transition:background .15s,color .15s,transform .12s}
.step-nav button:hover{background:var(--wash);color:var(--ink)}
.step-nav button:active{transform:scale(.92)}
.step-nav button[aria-current=step]{background:var(--ink);color:#fff}

/* Detail panel */
.inspector{padding:24px;border-left:1px solid var(--line);background:var(--paper);min-height:540px}
.inspector-top{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:22px;font-variant-numeric:tabular-nums}
.detail-icon{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--wash);margin-bottom:16px}
.detail-icon.has-logo{background:var(--paper);border:1px solid var(--line)}
.detail-icon .logo{width:26px;height:26px}
.detail-icon svg{width:22px;height:22px}
.inspector h2{font-size:22px;letter-spacing:-.03em;line-height:1.2;margin:0 0 10px;font-weight:620}
.inspector .description{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 18px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap}
.tag .logo{width:14px;height:14px}
.detail-label{font-size:12.5px;font-weight:600;margin:0 0 8px}
.why{font-size:14px;line-height:1.65;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
.why .detail-label{color:var(--ink)}
.connect-list{margin-top:22px}
.connect-list button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;padding:10px 0;font-size:14px;text-align:left;border-top:1px solid var(--line);transition:color .15s}
.connect-list button .icon{color:var(--muted);transition:transform .25s var(--ease),color .15s}
.connect-list button:hover{color:var(--accent)}
.connect-list button:hover .icon{transform:translateX(4px);color:var(--accent)}
.progress-track{height:2px;background:var(--line);margin:0 0 22px;overflow:hidden}
.progress-track div{height:100%;background:var(--accent);transform-origin:left;transition:transform .4s var(--ease)}
.story-card{margin:0 0 20px}
.story-head{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.story-head .icon,.story-head .logo{width:15px;height:15px}
.bubble{position:relative;display:inline-block;max-width:100%;padding:11px 14px;background:var(--wash);border-radius:14px 14px 14px 4px;font-size:14px;line-height:1.55}
.control-row{display:flex;gap:6px;align-items:center;margin-top:22px}
.control-row .primary{flex:1}
.control-row .secondary{padding:9px;min-width:38px}
/* The panel animates only when its subject changes. */
.motion .detail.swap .detail-main>*,.motion .detail.swap .detail-side>*{animation:rise .45s var(--ease) backwards}
.motion .detail.swap .detail-main>:nth-child(2){animation-delay:40ms}
.motion .detail.swap .detail-main>:nth-child(3){animation-delay:80ms}
.motion .detail.swap .detail-main>:nth-child(4){animation-delay:120ms}
.motion .detail.swap .detail-main>:nth-child(n+5){animation-delay:160ms}
.motion .detail.swap .detail-side>*{animation-delay:200ms}
/* A message arrives: three dots, then the text. */
.motion .detail.swap .bubble span{animation:fade .35s ease .55s backwards}
.motion .detail.swap .bubble:before{content:'';position:absolute;left:14px;top:50%;width:26px;height:6px;margin-top:-3px;background:radial-gradient(circle,var(--muted) 2.5px,transparent 3px) 0 0/10px 6px repeat-x;opacity:0;animation:typing .55s ease .1s}
@keyframes typing{0%{opacity:0}25%,75%{opacity:.7}100%{opacity:0}}

/* Below the explorer */
.toolchain{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.toolchain summary{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:550;cursor:pointer;padding:16px 20px;list-style:none;border-radius:12px}
.toolchain summary::-webkit-details-marker{display:none}
.toolchain summary:after{content:'+';font-size:18px;font-weight:400;color:var(--muted);transition:transform .3s var(--ease)}
.toolchain[open] summary:after{transform:rotate(45deg)}
.toolchain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;border-top:1px solid var(--line);padding:20px}
.toolchain[open] .toolchain-grid{animation:rise .4s var(--ease)}
.toolchain-grid strong{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
.toolchain-grid .tags{margin-bottom:0}
.toolchain-grid p{font-size:13px;color:var(--muted);line-height:1.6;margin-top:12px}
.takeaways{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:56px}
.takeaway{border-top:1px solid var(--ink);padding-top:16px}
.takeaway strong{font-size:15px;font-weight:600;display:block;margin-bottom:6px;letter-spacing:-.01em}
.takeaway p{font-size:14px;line-height:1.6;color:var(--muted)}
.footer{display:flex;justify-content:space-between;gap:20px;font-size:12.5px;line-height:1.6;color:var(--muted);margin-top:56px}

/* Scroll: a hairline shows reading progress, and each block eases in the first time it is seen. */
.scroll-progress{position:fixed;inset:0 0 auto 0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;z-index:5}
.motion [data-reveal]{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--i,0)*90ms)}
.motion [data-reveal].in{opacity:1;transform:none}
.motion h1 .w{animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--i)*45ms)}

/* Embedded in a case study: the explorer alone, edge to edge. */
html.embed,.embed{background:transparent}
.embed .shell{padding:0;max-width:none}
.embed .topline,.embed .intro,.embed .takeaways,.embed .footer,.embed .toolchain,.embed .scroll-progress{display:none}

/* Narrow frames (a portfolio modal, a tablet): the diagram takes the full width and the detail sits under it. */
@media(max-width:1240px){
  .canvas-layout{grid-template-columns:1fr}
  .stage-viewport{min-height:0}
  .inspector{border-left:0;border-top:1px solid var(--line);min-height:0}
  .detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px 40px;align-items:start}
  .detail-main .tags,.detail-main .story-card{margin-bottom:0}
  .detail-side .why{border-top:0;padding-top:0}
  .detail-side .why:first-child{margin-top:40px}
}
@media(max-width:1050px){.shell{padding:24px 24px 32px}.intro{padding:48px 0 32px}}
@media(max-width:760px){
  .shell{padding:18px 16px 28px}
  .intro{padding:36px 0 26px}
  .intro p{font-size:15.5px}
  .toolbar{align-items:start;flex-wrap:wrap}
  .canvas-header{padding:16px 16px 0}
  .canvas-bottom{flex-wrap:wrap}
  .takeaways,.toolchain-grid{grid-template-columns:1fr;gap:22px}
  .takeaways,.footer{margin-top:40px}
  .footer{flex-direction:column;gap:6px}
}
/* Phones: a readable card list replaces the scaled diagram. */
@media(max-width:600px){
  .detail{grid-template-columns:1fr;gap:20px}
  .detail-side .why:first-child{margin-top:0;border-top:1px solid var(--line);padding-top:18px}
  .stage-viewport{height:auto!important;max-height:none!important;overflow:visible}
  .stage{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:auto;height:auto;transform:none!important;margin:0!important;padding:16px}
  .stage>.connections,.stage>.group,.stage>div,.stage>.note{display:none}
  .stage .node{position:relative;left:auto!important;top:auto!important;width:100%;height:100%;min-height:120px;align-items:flex-start;flex-direction:column;padding:13px;gap:9px}
  .stage .node:hover{transform:none}
  .stage .node small{font-size:12px}
  .flow .stage{grid-template-columns:1fr;gap:20px}
  .flow .stage .node{flex-direction:row;align-items:center;min-height:74px;gap:12px;padding:14px}
  .flow .stage .node strong{font-size:14.5px}
  .flow .stage .node:after{content:'';position:absolute;left:32px;bottom:-21px;height:20px;border-left:1px solid var(--line-strong)}
  .flow .stage .node:last-of-type:after{display:none}
  .zoom{display:none}
}
/* Touch: every control is at least 44px. */
@media(pointer:coarse){
  .pill,.primary,.secondary,.connect-list button,.page-nav a{min-height:44px}
  .page-nav a{display:flex;align-items:center}
  .step-nav button,.zoom button{width:44px;height:44px}
  .control-row .secondary{min-width:44px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  .shell{padding:0}
  .toolbar,.zoom,.control-row,.scroll-progress{display:none}
  .inspector{break-inside:avoid}
}

if(embedded){document.body.classList.add('embed');document.documentElement.classList.add('embed');}
// Motion is opt-out: with reduced motion nothing animates and nothing starts hidden.
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!calm)document.documentElement.classList.add('motion');
let selected='backend',filter='all',scenario='answer',step=0,timer=null,scale=1,zoom=1,tourIndex=0,shown='';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const words=t=>t.split(' ').map((w,i)=>`<span class="w" style="--i:${i}">${w}</span>`).join(' ');
const cur=on=>on?'class="current" aria-current="page"':'';
const takeaways=isFlow?[
 ['Answers with evidence','Business knowledge and live departure data inform every response.'],['Human judgment stays central','Sensitive replies and deposit verification go through staff.'],['One connected operation','Conversations, approvals and bookings update the same workspace.']
]:[
 ['Modular by design','One backend, with clear boundaries between business responsibilities.'],['Authority outside the model','Trust policies and human approvals control consequential actions.'],['Events connect the parts','Persisted events drive delivery, audit and live dashboard updates.']
];
$('#app').innerHTML=`<div class="scroll-progress" aria-hidden="true"></div><div class="shell"><header class="topline"><a class="brand" href="tech-stack.html">AI Worker</a><nav class="page-nav" aria-label="Project illustrations"><a href="tech-stack.html" ${cur(!isFlow)}>Technology</a><a href="application-flow.html" ${cur(isFlow)}>Application flow</a></nav></header><section class="intro"><h1>${words(isFlow?'How a WhatsApp message becomes a booking.':'The stack behind an AI travel-agency employee.')}</h1><p data-reveal>${isFlow?'Three journeys through the AI Worker: a question answered from evidence, a reply held for staff approval, and a booking confirmed after a person verifies the deposit.':'AI Worker is an AI employee built to answer WhatsApp customers for Umrah and Haji travel agencies. Eight parts turn an agency’s own knowledge into supervised replies and bookings.'}</p><p class="meta" data-reveal>Local prototype · November 2026</p></section><section class="workspace ${isFlow?'flow':''}" data-reveal aria-label="${isFlow?'Application journey explorer':'Interactive architecture explorer'}"><div class="toolbar"><div class="filters" role="group" aria-label="${isFlow?'Choose a journey':'Filter technology layers'}">${isFlow?Object.entries(scenarios).map(([id,s])=>`<button class="pill" data-scenario="${id}" aria-pressed="${id===scenario}">${s.label}</button>`).join(''):['all','product','intelligence','data'].map(id=>`<button class="pill" data-filter="${id}" aria-pressed="${id==='all'}">${{all:'All',product:'Product & API',intelligence:'Intelligence',data:'Data & events'}[id]}</button>`).join('')}</div>${isFlow?'<span class="canvas-flag">Illustrative walkthrough</span>':`<button class="primary" id="tour">${icon('play',true)}<span>Trace a message</span></button>`}</div><div class="canvas-layout"><div class="canvas-wrap"><div class="canvas-header"><strong id="canvas-title">${isFlow?'':'System architecture'}</strong><p id="canvas-sub">${isFlow?'':'Eight parts in three layers. Select one to see what it does and why it is there.'}</p></div><div class="stage-viewport"><div class="stage" role="group" aria-label="${isFlow?'Journey steps':'Architecture components'}"></div></div><div class="canvas-bottom">${isFlow?'<div class="step-nav" role="group" aria-label="Jump to a step"></div><div class="journey-status" aria-live="polite"></div>':''}<div class="zoom" role="group" aria-label="Diagram zoom"><button id="zoom-out" aria-label="Zoom out">${icon('minus',true)}</button><output id="zoom-label">Fit</output><button id="zoom-in" aria-label="Zoom in">${icon('plus',true)}</button><button id="zoom-fit" aria-label="Fit diagram to view">${icon('repeat',true)}</button></div></div></div><aside class="inspector" aria-label="Selected ${isFlow?'step':'component'} details"></aside></div></section><section class="takeaways" aria-label="Project highlights">${takeaways.map(([t,p],i)=>`<div class="takeaway" data-reveal style="--i:${i}"><strong>${t}</strong><p>${p}</p></div>`).join('')}</section><footer class="footer" data-reveal><span>${isFlow?'Sample messages, not live customer data. No messages are sent and no payments are processed.':'Built from the project implementation. Production hosting not verified.'}</span><span>Product names and logos are trademarks of their owners.</span></footer></div>`;
if(!isFlow){const extra=document.createElement('details');extra.className='toolchain';extra.dataset.reveal='';extra.innerHTML=`<summary>Development and quality tooling</summary><div class="toolchain-grid">${toolchain.map(([title,chips,note])=>`<div><strong>${title}</strong><div class="tags">${chips.map(chip).join('')}</div>${note?`<p>${note}</p>`:''}</div>`).join('')}</div>`;$('.workspace').after(extra);}
const stage=$('.stage');
function setPlaying(on){$('.workspace').classList.toggle('playing',on);}
function fit(){const width=$('.stage-viewport').clientWidth;scale=Math.min(1,width/940)*zoom;stage.style.transform=`scale(${scale})`;$('.stage-viewport').style.height=`${600*scale}px`;$('.stage-viewport').style.minHeight='0';$('.stage-viewport').style.maxHeight=zoom>1?'750px':'';stage.style.marginRight=`${940*(scale-1)}px`;stage.style.marginLeft=`${Math.max(0,(width-940*scale)/2)}px`;$('#zoom-label').textContent=zoom===1?'Fit':`${Math.round(zoom*100)}%`;$('#zoom-out').disabled=zoom<=.8;$('#zoom-in').disabled=zoom>=1.6;}
new ResizeObserver(fit).observe($('.canvas-wrap'));
$('#zoom-in').onclick=()=>{zoom=Math.min(1.6,+(zoom+.2).toFixed(1));fit();};$('#zoom-out').onclick=()=>{zoom=Math.max(.8,+(zoom-.2).toFixed(1));fit();};$('#zoom-fit').onclick=()=>{zoom=1;fit();$('.stage-viewport').scrollTo(0,0);};
// Each edge draws itself in on entry and carries a pulse that runs along it while the edge is active.
function svgEdges(items){return `<svg class="connections" viewBox="0 0 940 600" aria-hidden="true"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5-7 3.5" fill="none" stroke="#a8a29e"/></marker></defs>${items.map(([a,b,p,label,x,y],i)=>`<path class="edge" pathLength="1" style="--e:${i}" data-from="${a}" data-to="${b}" d="${p}" marker-end="url(#arrow)"/><circle class="pulse" r="4" style="offset-path:path('${p}')"/>${label?`<text class="edge-label" x="${x}" y="${y}">${label}</text>`:''}`).join('')}</svg>`;}
function nodeHTML(n,index,order){return `<button class="node" id="node-${n.id}" data-node="${n.id}" data-group="${n.group}" style="left:${n.x}px;top:${n.y}px;--i:${order}" aria-pressed="false" aria-controls="detail-content"><span class="badge${n.logo&&LOGOS[n.logo]?' has-logo':''}">${mark(n)}</span><span><strong>${n.title}</strong><small>${n.sub}</small></span>${index!==undefined?`<span class="number">${index+1}</span>`:''}</button>`;}
// The detail panel animates only when its subject changes, not on every re-render.
function detail(key,main,side){const swap=key!==shown;shown=key;$('.inspector').innerHTML=`<div id="detail-content" class="detail${swap?' swap':''}"><div class="detail-main">${main}</div><div class="detail-side">${side}</div></div>`;}
function renderStack(){
 stage.innerHTML=`<div class="group" style="left:337px;top:20px;width:265px;height:505px"><span class="group-label">Python application process</span></div><div class="group-label" style="left:26px;top:38px">Interfaces</div><div class="group-label" style="left:702px;top:38px">Data and events</div>${svgEdges(edges)}${nodes.map((n,i)=>nodeHTML(n,undefined,i)).join('')}<span class="note" style="left:26px;top:452px">One channel per workspace</span>`;
 $$('[data-node]').forEach(el=>el.onclick=()=>{stopTour();selectNode(el.dataset.node);});
 selectNode(selected);
}
function selectNode(id){selected=id;const n=nodes.find(n=>n.id===id),connected=edges.filter(e=>e[0]===id||e[1]===id).map(e=>e[0]===id?e[1]:e[0]);
 for(const item of nodes){const el=$(`#node-${item.id}`);el.classList.toggle('selected',item.id===id);el.setAttribute('aria-pressed',String(item.id===id));el.classList.toggle('connected',connected.includes(item.id));el.classList.toggle('dim',filter!=='all'&&item.group!==filter&&item.id!==id);}
 $$('.edge').forEach(el=>{const active=el.dataset.from===id||el.dataset.to===id;el.classList.toggle('active',active);el.classList.toggle('dim',!active);});
 detail(id,`<div class="inspector-top"><span>Component</span><span>${nodes.indexOf(n)+1} of ${nodes.length}</span></div><div class="detail-icon${n.logo&&LOGOS[n.logo]?' has-logo':''}">${mark(n)}</div><h2>${n.title}</h2><p class="description">${n.description}</p><div class="tags">${n.tags.map(chip).join('')}</div>`,`<div class="why"><div class="detail-label">Why it is built this way</div><p>${n.why}</p></div><div class="connect-list"><div class="detail-label">Connected to</div>${connected.map(id=>`<button data-connect="${id}">${nodes.find(n=>n.id===id).title}${icon('arrow',true)}</button>`).join('')}</div>`);
 $$('[data-connect]').forEach(el=>el.onclick=()=>{stopTour();selectNode(el.dataset.connect);});
}
function stopTour(){clearInterval(timer);timer=null;setPlaying(false);if(!isFlow)$('#tour').innerHTML=icon('play',true)+'<span>Trace a message</span>';}
if(!isFlow){renderStack();$$('[data-filter]').forEach(el=>el.onclick=()=>{stopTour();filter=el.dataset.filter;$$('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));if(filter!=='all')selected=nodes.find(n=>n.group===filter).id;selectNode(selected);});$('#tour').onclick=()=>{if(timer){stopTour();return;}filter='all';$$('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter==='all')));const tour=['whatsapp','backend','ai','knowledge','database','events','dashboard'];tourIndex=0;selectNode(tour[0]);$('#tour').innerHTML=icon('pause',true)+'<span>Pause trace</span>';setPlaying(true);timer=setInterval(()=>{tourIndex++;if(tourIndex>=tour.length){stopTour();return;}selectNode(tour[tourIndex]);},3000);};}
function flowPositions(count){return count===6?[[75,85],[363,85],[651,85],[651,350],[363,350],[75,350]]:[[75,85],[363,85],[651,85],[651,350],[363,350]];}
function renderFlow(){const s=scenarios[scenario],pos=flowPositions(s.steps.length);const fNodes=s.steps.map((s,i)=>({id:`step${i}`,x:pos[i][0],y:pos[i][1],title:s[1],sub:s[2],icon:s[0],logo:s[7],group:'step'}));const links=fNodes.slice(0,-1).map((n,i)=>{const next=fNodes[i+1];let p;if(n.y===next.y)p=next.x>n.x?`M${n.x+214} ${n.y+41}H${next.x}`:`M${n.x} ${n.y+41}H${next.x+214}`;else p=`M${n.x+107} ${n.y+82}V${next.y}`;return [n.id,next.id,p,'',0,0];});
 stage.innerHTML=`${svgEdges(links)}<div style="left:75px;top:40px" class="group-label">The request</div><div style="left:75px;top:305px" class="group-label">The outcome</div>${fNodes.map((n,i)=>nodeHTML(n,i,i)).join('')}`;
 $('#canvas-title').textContent=s.tag;$('#canvas-sub').textContent=s.subtitle;
 $('.step-nav').innerHTML=s.steps.map((_,i)=>`<button data-step="${i}" aria-label="Step ${i+1}: ${s.steps[i][1]}">${i+1}</button>`).join('');
 $$('[data-node]').forEach(el=>el.onclick=()=>{pauseFlow();step=Number(el.dataset.node.replace('step',''));updateFlow();});$$('[data-step]').forEach(el=>el.onclick=()=>{pauseFlow();step=Number(el.dataset.step);updateFlow();});updateFlow();fit();
}
function pauseFlow(){clearInterval(timer);timer=null;setPlaying(false);}
function updateFlow(){const focused=document.activeElement?.id;const s=scenarios[scenario],data=s.steps[step],last=step===s.steps.length-1;
 $$('[data-node]').forEach((el,i)=>{el.classList.toggle('selected',i===step);el.classList.toggle('done',i<step);el.setAttribute('aria-pressed',String(i===step));});
 $$('.edge').forEach((el,i)=>{el.classList.toggle('active',i===step-1);el.classList.toggle('dim',i>=step);});
 $$('[data-step]').forEach((el,i)=>{if(i===step)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
 $('.journey-status').textContent=data[1];
 detail(scenario+step,`<div class="inspector-top"><span>${s.label}</span><span>Step ${step+1} of ${s.steps.length}</span></div><div class="progress-track"><div style="transform:scaleX(${(step+1)/s.steps.length})"></div></div><h2>${data[1]}</h2><p class="description">${data[5]}</p><div class="story-card"><div class="story-head">${data[7]&&LOGOS[data[7]]?logo(data[7]):icon(data[0])}${data[4]}</div><div class="bubble"><span>${data[3]}</span></div></div>`,`<div class="why"><div class="detail-label">In the system</div><p>${data[6]}</p></div><div class="control-row"><button class="secondary" id="prev" aria-label="Previous step" ${step===0?'disabled':''}>${icon('back',true)}</button><button class="primary" id="play">${icon(timer?'pause':last?'repeat':'play',true)}<span>${timer?'Pause':last?'Replay journey':'Play walkthrough'}</span></button><button class="secondary" id="next" aria-label="Next step" ${last?'disabled':''}>${icon('arrow',true)}</button></div>`);
 if(['prev','next','play'].includes(focused))document.getElementById(focused)?.focus({preventScroll:true});
 $('#prev').onclick=()=>{pauseFlow();step=Math.max(0,step-1);updateFlow();};$('#next').onclick=()=>{pauseFlow();step=Math.min(s.steps.length-1,step+1);updateFlow();};$('#play').onclick=()=>{if(timer){pauseFlow();updateFlow();return;}if(step===s.steps.length-1)step=0;setPlaying(true);timer=setInterval(()=>{step++;if(step>=s.steps.length-1){step=s.steps.length-1;pauseFlow();}updateFlow();},4500);updateFlow();};
}
// Entry motion: nodes rise in order and the connections draw themselves, once the diagram is on screen.
let enterTimer;
function playEnter(){if(calm)return;stage.classList.remove('pre','enter');void stage.offsetWidth;stage.classList.add('enter');clearTimeout(enterTimer);enterTimer=setTimeout(()=>stage.classList.remove('enter'),2600);}
if(isFlow){renderFlow();$$('[data-scenario]').forEach(el=>el.onclick=()=>{pauseFlow();scenario=el.dataset.scenario;step=0;$$('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));renderFlow();playEnter();});}
if(!calm){
 stage.classList.add('pre');
 const reveal=el=>{el.classList.add('in');if(el.classList.contains('workspace'))playEnter();};
 if('IntersectionObserver' in window){const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){reveal(e.target);io.unobserve(e.target);}}),{threshold:.08});$$('[data-reveal]').forEach(el=>io.observe(el));}
 else $$('[data-reveal]').forEach(reveal);
 // Never leave the diagram hidden if the observer did not fire.
 setTimeout(()=>{if(stage.classList.contains('pre')){$('.workspace').classList.add('in');playEnter();}},4000);
 if(!embedded){const bar=$('.scroll-progress');const onScroll=()=>{const max=document.documentElement.scrollHeight-innerHeight;bar.style.transform=`scaleX(${max>0?Math.min(1,scrollY/max):0})`;};addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);onScroll();}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(isFlow){pauseFlow();updateFlow();}else stopTour();}});
// Escape pauses playback. When nothing is playing inside an embed, tell the host page so its dialog can close.
document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(timer){if(isFlow){pauseFlow();updateFlow();}else stopTour();}else if(embedded&&window.parent!==window)window.parent.postMessage({source:'ai-worker-illustration',action:'escape'},'*');});
fit();
</script></body></html>
